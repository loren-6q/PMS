<!-- ==========================================================================
     accounting.html - Financial Ledger & Weekly/Monthly/Yearly Summaries
     Wild & Wandering Property Management System
     ========================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wild &amp; Wandering | Accounting</title>
    <link rel="apple-touch-icon" href="../gfx/WWicon.png">
    <link rel="icon" type="image/png" href="../gfx/WWicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-slate-100 p-0 sm:p-2 h-[100dvh] fixed inset-0 flex flex-col overflow-hidden text-slate-800">

    <!-- Boot Loader -->
    <div id="boot-loader" class="loading-overlay">
        <div class="spinner"></div>
        <div class="mt-4 font-black text-slate-800 uppercase tracking-widest text-center px-4">
            <span id="sync-status">Loading Financials...</span>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-h-0 mx-auto w-full max-w-[1950px]">

        <!-- UNIVERSAL TOP NAVIGATION -->
        <div id="app-nav" data-app="accounting">
            <div id="nav-center-slot" class="flex items-center gap-1 flex-wrap">
                <!-- Date Basis Selector -->
                <select id="acc-date-basis" onchange="window.renderAccounting()" class="bg-white border border-slate-300 rounded px-1.5 py-0.5 text-[11px] font-black uppercase text-slate-700 outline-none cursor-pointer" title="Which date the range applies to">
                    <option value="checkIn">By Check-In</option>
                    <option value="stayover">By Stayover</option>
                    <option value="checkOut">By Check-Out</option>
                    <option value="payment">By Payment Date</option>
                </select>

                <!-- Period Preset Selector -->
                <select id="acc-period-preset" onchange="window.applyPeriodPreset(this.value)" class="bg-white border border-slate-300 rounded px-1.5 py-0.5 text-[11px] font-black uppercase text-blue-700 outline-none cursor-pointer">
                    <option value="this_month" selected>This Month</option>
                    <option value="last_month">Last Month</option>
                    <option value="next_month">Next Month</option>
                    <option value="this_week">This Week</option>
                    <option value="last_week">Last Week</option>
                    <option value="this_year">This Year</option>
                    <option value="last_year">Last Year</option>
                    <option value="all">All Dates</option>
                    <option value="custom">Custom Range</option>
                </select>

                <!-- Explicit Start / End Date Inputs -->
                <div class="flex items-center gap-1 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-300">
                    <input type="date" id="acc-date-start" onchange="window.onCustomDateChange()" class="bg-white border border-slate-300 rounded px-1 py-0.5 text-[11px] font-bold outline-none cursor-pointer">
                    <span class="text-[10px] font-black text-slate-400">TO</span>
                    <input type="date" id="acc-date-end" onchange="window.onCustomDateChange()" class="bg-white border border-slate-300 rounded px-1 py-0.5 text-[11px] font-bold outline-none cursor-pointer">
                </div>
            </div>

            <div id="nav-right-slot" class="flex items-center gap-1.5">
                <div class="flex bg-slate-100 rounded p-0.5 border border-slate-300 text-[10px] font-black uppercase">
                    <button type="button" id="btn-view-ledger" onclick="window.setAccView('ledger')" class="px-2 py-0.5 rounded bg-slate-900 text-white cursor-pointer">Detailed</button>
                    <button type="button" id="btn-view-rollup" onclick="window.setAccView('rollup')" class="px-2 py-0.5 rounded text-slate-600 hover:bg-white cursor-pointer">Summaries</button>
                </div>

                <button type="button" onclick="window.exportAccountingXlsx()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-black text-[11px] uppercase flex items-center gap-1 shadow-xs cursor-pointer whitespace-nowrap" title="Download Excel Workbook">
                    <i data-lucide="file-spreadsheet" size="13"></i>
                    <span>Export XLSX</span>
                </button>
            </div>
        </div>

        <!-- ACCOUNTING CONTROL STRIP -->
        <div class="bg-white px-2.5 py-1.5 rounded-none sm:rounded-t-lg border-x border-t border-slate-300 flex flex-wrap items-center justify-between gap-2 text-xs shrink-0 unselectable">
            <div class="flex items-center gap-2.5 flex-wrap">
                <!-- Include Pending Payouts + Payout Lag -->
                <div class="flex items-center gap-2 bg-amber-50 border border-amber-300 px-2 py-0.5 rounded">
                    <label class="flex items-center gap-1.5 cursor-pointer font-black text-[11px] text-amber-900">
                        <input type="checkbox" id="acc-include-pending" checked onchange="window.renderAccounting()" class="row-checkbox">
                        <span>Include Pending Payouts</span>
                    </label>
                    <span class="text-amber-300">|</span>
                    <div class="flex items-center gap-1" title="Days after check-out before OTA payouts count as received in bank">
                        <span class="text-[10px] font-black uppercase text-amber-800">Payout Lag:</span>
                        <input type="number" id="acc-ota-lag" value="3" min="0" max="30" oninput="window.renderAccounting()" class="w-10 bg-white border border-amber-300 rounded px-1 py-0.2 text-[11px] font-black text-center text-amber-900 outline-none">
                        <span class="text-[10px] font-bold text-amber-800">d</span>
                    </div>
                </div>

                <!-- Remove Unpaid Quick Toggle -->
                <button type="button" id="btn-remove-unpaid" onclick="window.toggleRemoveUnpaid()" class="px-2 py-0.5 rounded border border-slate-300 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-[10px] uppercase cursor-pointer" title="Exclude Cancelled, No-Show, Unconfirmed, New, Volunteer & To-Charge bookings">
                    Remove Unpaid
                </button>

                <!-- Column Visibility Picker -->
                <div class="relative">
                    <button type="button" onclick="window.toggleAccDropdown('acc-columns-dropdown', this)" class="px-2 py-0.5 rounded border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-black text-[10px] uppercase flex items-center gap-1 cursor-pointer">
                        <i data-lucide="columns-3" class="!w-3 !h-3 text-indigo-600"></i>
                        <span>Columns ▾</span>
                    </button>
                    <div id="acc-columns-dropdown" class="acc-multi-drop hidden fixed w-48 bg-slate-900 text-white border border-slate-600 rounded shadow-2xl z-[9999] max-h-72 overflow-y-auto p-1.5 text-left"></div>
                </div>
            </div>

            <!-- Live Totals Summary Pill -->
            <div id="acc-audit-pill" class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-emerald-50 text-emerald-800 border border-emerald-200 font-mono">
                0 Rows
            </div>
        </div>

        <!-- ================================================================== -->
        <!-- VIEW 1: DETAILED LEDGER                                            -->
        <!-- ================================================================== -->
        <main id="view-ledger" class="flex-1 flex flex-col min-h-0 bg-white border border-slate-300 sm:rounded-b-lg shadow overflow-hidden">
            <div class="flex-1 overflow-auto bg-white">
                <table class="w-full text-left border-collapse whitespace-nowrap text-xs tabular-nums" id="acc-table">
                    <thead class="sticky top-0 z-30 bg-slate-900 text-white select-none">
                        <tr id="acc-header-row" class="text-[10px] font-black uppercase tracking-wider border-b border-slate-700"></tr>
                        <tr id="acc-filter-row" class="bg-slate-800 text-[10px] font-bold"></tr>
                    </thead>

                    <tbody id="acc-ledger-body" class="divide-y divide-slate-200 bg-white font-semibold text-xs"></tbody>

                    <!-- Sticky Totals Footer -->
                    <tfoot id="acc-ledger-foot" class="sticky bottom-0 z-10 bg-slate-900 text-white font-black text-xs border-t-2 border-slate-600 shadow-inner"></tfoot>
                </table>
            </div>
        </main>

        <!-- ================================================================== -->
        <!-- VIEW 2: WEEKLY / MONTHLY / YEARLY SUMMARIES + CHART                -->
        <!-- ================================================================== -->
        <section id="view-rollup" class="hidden flex-1 flex-col min-h-0 bg-white border border-slate-300 sm:rounded-b-lg shadow overflow-hidden">
            <div class="p-2.5 bg-slate-50 border-b border-slate-300 flex items-center justify-between gap-2 shrink-0 flex-wrap">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-black uppercase text-slate-800">Grouped by:</span>
                    <div class="flex bg-white rounded p-0.5 border border-slate-300 text-[10px] font-black uppercase">
                        <button type="button" id="btn-rollup-weekly" onclick="window.setRollupGranularity('weekly')" class="px-2 py-0.5 rounded text-slate-600 hover:bg-slate-100 cursor-pointer">Week</button>
                        <button type="button" id="btn-rollup-monthly" onclick="window.setRollupGranularity('monthly')" class="px-2 py-0.5 rounded bg-indigo-600 text-white cursor-pointer">Month</button>
                        <button type="button" id="btn-rollup-yearly" onclick="window.setRollupGranularity('yearly')" class="px-2 py-0.5 rounded text-slate-600 hover:bg-slate-100 cursor-pointer">Year</button>
                    </div>
                </div>
                <div class="flex items-center gap-3 text-[10px] font-black uppercase flex-wrap">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-emerald-500 inline-block"></span> Cash</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-sky-500 inline-block"></span> Bank</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-blue-500 inline-block"></span> Card</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-teal-500 inline-block"></span> OTA Payouts</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-amber-400 inline-block"></span> Pending</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-indigo-400 inline-block"></span> Future</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-rose-400 inline-block"></span> Fees/Comm</span>
                </div>
            </div>

            <div id="rollup-chart-container" class="p-3 border-b border-slate-300 bg-white shrink-0 overflow-x-auto"></div>

            <div class="flex-1 overflow-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap text-xs tabular-nums">
                    <thead id="rollup-table-head" class="sticky top-0 z-20 bg-slate-900 text-white text-[10px] font-black uppercase tracking-wider"></thead>
                    <tbody id="rollup-table-body" class="divide-y divide-slate-200 bg-white font-semibold"></tbody>
                    <tfoot id="rollup-table-foot" class="sticky bottom-0 z-10 bg-slate-900 text-white font-black border-t-2 border-slate-600"></tfoot>
                </table>
            </div>
        </section>

    </div>

    <!-- ====================================================================== -->
    <!-- IN-PAGE GUEST FOLIO MODAL                                              -->
    <!-- ====================================================================== -->
    <div id="guest-modal" class="modal-overlay">
        <div id="guest-modal-content" class="modal-content bg-white rounded-xl shadow-2xl border-2 border-slate-800 flex flex-col h-auto max-h-[calc(100dvh-1rem)] w-full max-w-[480px]">
            <div id="modal-header-btn" class="bg-slate-900 p-2 text-white flex justify-between items-center cursor-move rounded-t-lg unselectable shrink-0" onmousedown="window.startDrag(event)">
                <div class="flex items-center gap-2 pointer-events-none">
                    <i data-lucide="user" size="18"></i>
                    <h3 id="modal-guest-name-display" class="text-lg font-black uppercase tracking-tighter leading-none">BOOKING</h3>
                </div>
                <button type="button" onclick="event.stopPropagation(); window.closeGuestModal()" class="p-1 hover:bg-red-500 rounded cursor-pointer"><i data-lucide="x" size="20"></i></button>
            </div>

            <div id="itinerary-stripe" class="hidden bg-slate-900 border-b border-slate-700 px-2 py-1 text-white flex items-center justify-between gap-1 overflow-x-auto no-scrollbar unselectable text-xs shrink-0"></div>

            <form id="guest-form" class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-2 space-y-2 no-scrollbar relative block">
                <input type="hidden" id="guest-id">
                <input type="hidden" id="created-at">
                <input type="hidden" id="created-by">
                <input type="hidden" id="guest-status-hidden">

                <div class="section-header rounded-t-md mt-1" onclick="window.toggleSection('guest-profile-section', 'profile-chevron')">
                    <span>Guest Details</span>
                    <i data-lucide="chevron-down" id="profile-chevron" size="14" class="transition-transform duration-200"></i>
                </div>

                <div id="guest-profile-section" class="bg-slate-50 p-1.5 border-x border-b border-slate-200 rounded-b-md space-y-1.5 mt-0 block">
                    <div class="grid grid-cols-2 gap-1.5"><div><label class="field-label">First Name</label><input type="text" id="first-name" class="input-base uppercase" oninput="window.updateHeaderName()"></div><div><label class="field-label">Last Name</label><input type="text" id="last-name" required class="input-base uppercase" oninput="window.updateHeaderName()"></div></div>
                    <div class="grid grid-cols-2 gap-1.5"><div><label class="field-label">Phone</label><input type="text" id="phone" class="input-base"></div><div><label class="field-label">Country</label><input type="text" id="guest-country" class="input-base"></div></div>
                    <div><label class="field-label">Email</label><input type="text" id="email" class="input-base" oninput="window.checkEmailProxy(this.value)"></div>
                </div>

                <div class="bg-slate-50 p-1.5 rounded-md border border-slate-200 space-y-1.5">
                    <div class="flex items-center gap-1.5">
                        <div class="w-[130px] shrink-0">
                            <label class="field-label text-center mb-0.5">IN</label>
                            <div class="flex items-stretch bg-white border border-slate-300 rounded overflow-hidden shadow-sm h-[28px]">
                                <button type="button" onclick="window.nudgeDate('in', -1)" class="w-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs flex items-center justify-center border-r border-slate-200 cursor-pointer">◀</button>
                                <input type="date" id="check-in" required class="w-full text-[11px] font-black px-0 text-center bg-transparent border-none outline-none cursor-pointer" onchange="window.handleCheckInPicker(this.value)">
                                <button type="button" onclick="window.nudgeDate('in', 1)" class="w-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs flex items-center justify-center border-l border-slate-200 cursor-pointer">▶</button>
                            </div>
                        </div>

                        <div class="w-[130px] shrink-0">
                            <label class="field-label text-center mb-0.5">OUT</label>
                            <div class="flex items-stretch bg-white border border-slate-300 rounded overflow-hidden shadow-sm h-[28px]">
                                <button type="button" onclick="window.nudgeDate('out', -1)" class="w-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs flex items-center justify-center border-r border-slate-200 cursor-pointer">◀</button>
                                <input type="date" id="check-out" required class="w-full text-[11px] font-black px-0 text-center bg-transparent border-none outline-none cursor-pointer" onchange="window.handleCheckOutPicker(this.value)">
                                <button type="button" onclick="window.nudgeDate('out', 1)" class="w-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-xs flex items-center justify-center border-l border-slate-200 cursor-pointer">▶</button>
                            </div>
                        </div>

                        <div class="flex-1 min-w-0 flex flex-col items-center">
                            <label class="field-label text-center mb-0.5">#NTS</label>
                            <div id="booking-nights-display" class="w-full h-[28px] bg-indigo-50 border border-indigo-200 rounded font-black text-xs text-indigo-700 flex items-center justify-center px-1.5 shadow-sm select-none">
                                <span id="nights-count-text">1 Nt</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-1 pt-1 border-t border-slate-200">
                        <div class="w-full h-[28px] bg-white border border-slate-300 rounded shadow-sm flex items-center justify-between px-0.5 text-[10px] font-black text-slate-600 select-none">
                            <button type="button" onclick="window.adjustPax(-1)" class="w-5 h-full flex items-center justify-center text-slate-500 hover:text-slate-800 font-black cursor-pointer">◀</button>
                            <div class="flex items-center gap-0.5">
                                <input type="number" id="pax-count" value="1" min="1" class="w-6 text-center text-xs font-black border-none outline-none p-0 bg-transparent" oninput="window.calcFinancials()">
                                <span class="text-[8px] uppercase font-black text-slate-400">PAX</span>
                            </div>
                            <button type="button" onclick="window.adjustPax(1)" class="w-5 h-full flex items-center justify-center text-slate-500 hover:text-slate-800 font-black cursor-pointer">▶</button>
                        </div>

                        <button type="button" id="status-cycle-btn" onclick="window.cycleStatus()" class="w-full h-[28px] rounded text-[10px] font-black uppercase text-center shadow-sm cursor-pointer border unselectable truncate px-1"></button>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <div><label class="field-label">Booked Type</label><input type="text" id="booked-type" class="input-base" placeholder="--"></div>
                    <div>
                        <div class="flex justify-between items-end mb-1">
                            <label class="field-label text-blue-600 mb-0">Assigned Rooms</label>
                            <button type="button" onclick="window.addRoomSelect()" class="text-[9px] font-black uppercase text-blue-600 bg-blue-100 px-1.5 py-0.5 rounded hover:bg-blue-200 border border-blue-200 cursor-pointer">+ ADD</button>
                        </div>
                        <div id="assigned-rooms-container" class="max-h-[110px] overflow-y-auto no-scrollbar border border-slate-200 rounded p-1 bg-slate-50 flex flex-col gap-1 w-full"></div>
                    </div>
                </div>

                <div class="section-header rounded-t-md unselectable" onclick="window.toggleSection('fin-section', 'fin-chevron')">
                    <span>Payments</span>
                    <i data-lucide="chevron-down" id="fin-chevron" size="14" class="transition-transform duration-200"></i>
                </div>

                <div id="fin-section" class="bg-slate-100 p-1.5 border-x border-b border-slate-200 rounded-b-md mt-0 block">
                    <div class="flex justify-between items-end border-b-2 border-slate-200 pb-1 mb-1">
                        <div class="flex gap-2 items-end">
                            <div>
                                <div class="flex items-center justify-between"><label class="field-label">Total Price</label><button type="button" onclick="window.openChargeModal()" class="text-[9px] font-black text-blue-600 hover:text-blue-800 bg-blue-100 hover:bg-blue-200 px-1 py-0.5 rounded cursor-pointer ml-1.5 border border-blue-200">+ ADD ฿</button></div>
                                <div class="flex items-center text-lg font-black">฿<input type="number" id="total-price" value="0" step="0.01" class="w-20 p-0 ml-1 border-none bg-transparent outline-none text-lg font-black" oninput="window.calcFinancials()"></div>
                            </div>
                            <div class="mb-0.5"><label class="field-label text-[9px] text-slate-400">Net Est.</label><div class="flex items-center text-xs font-bold text-slate-500">฿<input type="number" id="net-price" value="0" step="0.01" class="w-14 p-0 ml-0.5 border-none bg-transparent outline-none text-xs font-bold text-slate-500" oninput="window.overrideNet()"></div></div>
                        </div>
                        <div class="flex gap-3 text-right items-center">
                            <div><label class="field-label">Paid</label><div class="font-black text-lg text-green-600 leading-none" id="display-paid">฿0</div></div>
                            <div><label class="field-label !text-red-500">Due</label><div class="font-black text-red-600 text-xl leading-none" id="display-due">฿0</div></div>
                            <div class="flex flex-col items-center justify-center ml-1 border-l border-slate-300 pl-1.5 cursor-pointer unselectable" onclick="window.toggleBadCC()"><span class="text-[9px] font-black leading-none text-slate-400">BAD</span><span class="text-[9px] font-black leading-none text-slate-400">CC</span><div id="bad-cc-box" class="w-3.5 h-3.5 border-2 border-slate-300 rounded mt-0.5 flex items-center justify-center"></div></div>
                        </div>
                    </div>

                    <div id="extra-charges-wrapper" class="hidden mb-1.5 p-1 bg-amber-50/70 border border-amber-200 rounded">
                        <div class="flex justify-between items-center text-[9px] font-black uppercase text-amber-800 mb-1 px-1 border-b border-amber-200 pb-0.5">
                            <span>Itemized Add-ons</span>
                            <span id="extra-charges-total">+฿0</span>
                        </div>
                        <div id="extra-charges-list" class="space-y-1"></div>
                    </div>

                    <div id="payments-list" class="space-y-1 mb-1.5"></div>
                    <button type="button" onclick="window.addPaymentRow()" class="w-full py-1 border-2 border-dashed border-slate-300 rounded text-xs font-black text-slate-500 hover:bg-slate-200 uppercase unselectable cursor-pointer">+ ADD PAYMENT</button>
                </div>

                <div class="section-header rounded-t-md unselectable" onclick="window.toggleSection('meta-section', 'meta-chevron')">
                    <span>More</span>
                    <i data-lucide="chevron-down" id="meta-chevron" size="14" class="transition-transform duration-200"></i>
                </div>

                <div id="meta-section" class="bg-slate-50 p-1.5 border-x border-b border-slate-200 rounded-b-md mt-0 block">
                    <label class="field-label mb-0 border-b border-slate-200 pb-1">Guest Notes</label>
                    <textarea id="guest-notes" class="smart-notes w-full bg-white border border-slate-300 font-bold text-xs p-1.5 mb-1.5 rounded outline-none mt-1" placeholder="NOTES..."></textarea>
                    <div class="grid grid-cols-3 gap-1.5">
                        <div class="flex flex-col"><label class="field-label">Source</label><select id="booking-source" class="w-full text-xs font-bold bg-transparent border-none p-0 outline-none uppercase cursor-pointer" onchange="window.calcFinancials()"><option value="direct">DIRECT</option><option value="booking.com">BOOKING.COM</option><option value="agoda">AGODA</option><option value="hostelworld">HOSTELWORLD</option><option value="airbnb">AIRBNB</option><option value="expedia">EXPEDIA</option><option value="ctrip">CTRIP</option><option value="walk-in">WALK-IN</option><option value="other">OTHER</option></select></div>
                        <div class="flex flex-col"><label class="field-label">Book Date</label><input type="date" id="booking-date" class="w-full text-xs font-bold bg-transparent border-none p-0 outline-none"></div>
                        <div class="flex flex-col"><label class="field-label">Book ID</label><input type="text" id="booking-id" class="w-full text-xs font-bold bg-transparent border-none p-0 outline-none"></div>
                        <div class="flex flex-col col-span-3 mt-0.5 pt-1 border-t border-slate-200"><label class="field-label text-[9px] text-amber-600">Link Code</label><input type="text" id="link-code" class="w-24 text-xs font-black bg-amber-50 border border-amber-200 text-amber-700 rounded px-1 outline-none uppercase text-center"></div>
                    </div>
                </div>
            </form>

            <div class="bg-slate-100 p-2 flex gap-2 justify-between items-center border-t border-slate-300 unselectable shrink-0">
                <div class="flex items-center gap-1 shrink-0">
                    <button type="button" id="delete-btn" title="Delete" onclick="window.requestDelete()" class="btn-tool bg-red-600 text-white hover:bg-red-700"><i data-lucide="trash-2" size="14"></i></button>
                    <button type="button" id="hist-btn" title="History" onclick="window.showAuditHistory()" class="btn-tool bg-slate-200 text-slate-700 hover:bg-slate-300"><i data-lucide="clock" size="14"></i></button>

        // --- Date & Money Helpers ---
        function addDaysToYmd(ymd, days) {
            const ms = parseYMD(ymd);

        }

        function fmtMoney(num) {
            const val = roundCurrency(Number(num) || 0);
            if (val === 0) return '0.00';
            return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function normalizePaymentMethodKey(rawKey) {
            const clean = String(rawKey || '').trim().toLowerCase().replace(/[\s_]+/g, '-');
            if (!clean) return '';
            if (clean === 'cc-fee') return 'card-kp';
            if (clean === 'qr') return 'scan';
            if (clean.endsWith('-pay') || clean.endsWith('-kp')) {
                const suffix = clean.endsWith('-pay') ? '-pay' : '-kp';
                const prefix = clean.slice(0, -suffix.length);
                if (prefix === 'card') return 'card-kp';
                const canonCode = resolveChannelCode(prefix);
                return `${canonCode.toLowerCase()}${suffix}`;
            }
            return clean;
        }

        function buildExactPaymentMap(propConfig) {
            const methods = normalizePaymentMethods(propConfig?.payments || []);
            const map = new Map();
            methods.forEach(pm => {
                if (!pm || !pm.key) return;
                const key = String(pm.key).trim().toLowerCase();
                map.set(key, {
                    key,
                    label: pm.label || key,
                    type: pm.type || 'revenue',
                    channel: pm.channel || null
                });
            });
            return map;
        }

        // ------------------------------------------------------------------
        // 3. EXACT RESERVATION FINANCIAL DECOMPOSITION
        // ------------------------------------------------------------------

        function classifyBookingFinancials(booking, todayStr, otaLagDays, includePending, dateBasis, startStr, endStr) {
            const rawGross = roundCurrency(Number(booking.totalPrice) || 0);
            const status = String(booking.status || 'future').toLowerCase().trim();
            const isNonCollectible = NON_COLLECTIBLE_STATUSES.has(status);

            const inMs = parseYMD(booking.checkIn);
            const outMs = parseYMD(booking.checkOut);
            const nights = (inMs && outMs && outMs > inMs) ? Math.max(1, Math.round((outMs - inMs) / 86400000)) : 1;

            let cash = 0;
            let bank = 0;
            let card = 0;
            let otaPayouts = 0;
            let pending = 0;
            let fees = 0;
            let unknown = 0;
            const unknownKeys = [];
            let matchedPaymentInPeriod = false;

            const payments = Array.isArray(booking.payments) ? booking.payments : [];
            payments.forEach(p => {
                const amt = roundCurrency(Number(p.amt) || 0);
                if (amt === 0) return;

                const rawMethod = String(p.method || '').trim();
                const normKey = normalizePaymentMethodKey(rawMethod);
                const payDate = String(p.date || booking.checkIn || '');

                if (dateBasis === 'payment') {
                    if (startStr && payDate < startStr) return;
                    if (endStr && payDate > endStr) return;
                    matchedPaymentInPeriod = true;
                }

                const pmDef = paymentSchemaMap.get(normKey);
                if (!pmDef) {
                    unknown = roundCurrency(unknown + amt);
                    unknownKeys.push(rawMethod || '(blank)');
                    return;
                }

                const isOtaChannel = !!(pmDef.channel && pmDef.channel !== 'card');

                if (isNonCollectible && isOtaChannel) {
                    return;
                }

                if (pmDef.type === 'commission') {
                    fees = roundCurrency(fees + amt);
                    return;
                }

                if (pmDef.type === 'revenue') {
                    if (pmDef.key === 'cash') {
                        if (payDate && payDate > todayStr) {
                            pending = roundCurrency(pending + amt);
                        } else {
                            cash = roundCurrency(cash + amt);
                        }
                        return;
                    }

                    if (isOtaChannel) {
                        if ((booking.checkIn || '') > todayStr) {
                            return;
                        }
                        const settleDate = addDaysToYmd(booking.checkOut || payDate, otaLagDays);
                        if (settleDate > todayStr) {
                            pending = roundCurrency(pending + amt);
                        } else {
                            otaPayouts = roundCurrency(otaPayouts + amt);
                        }
                        return;
                    }

                    if (pmDef.key === 'card') {
                        if (payDate && payDate > todayStr) {
                            pending = roundCurrency(pending + amt);
                        } else {
                            card = roundCurrency(card + amt);
                        }
                        return;
                    }

                    if (payDate && payDate > todayStr) {
                        pending = roundCurrency(pending + amt);
                    } else {
                        bank = roundCurrency(bank + amt);
                    }
                    return;
                }

                unknown = roundCurrency(unknown + amt);
                unknownKeys.push(`${rawMethod}:${pmDef.type}`);
            });

            if (dateBasis === 'payment' && !matchedPaymentInPeriod) {
                return null;
            }

            const totalAccountedPaid = roundCurrency(cash + bank + card + otaPayouts + pending + fees + unknown);
            const gross = dateBasis === 'payment' ? totalAccountedPaid : rawGross;
            const diff = dateBasis === 'payment' ? 0 : roundCurrency(rawGross - totalAccountedPaid);
            const remaining = Math.max(0, diff);
            const overpaid = diff < -0.01 ? Math.abs(diff) : 0;

            let future = 0;
            let unpaid = 0;
            let uncollectible = 0;

            if (dateBasis !== 'payment') {
                if (isNonCollectible) {
                    uncollectible = remaining;
                } else if (LEFT_UNPAID_STATUSES.has(status) || (status === 'here' && booking.checkOut && booking.checkOut < todayStr)) {
                    unpaid = remaining;
                } else {
                    future = remaining;
                }
            }

            const net = roundCurrency(cash + bank + card + otaPayouts + (includePending ? pending : 0));

            return {
                id: booking.id,
                bookId: booking.bookId || booking.id,
                name: `${booking.firstName || ''} ${booking.lastName || ''}`.trim() || 'Unknown',
                status,
                source: String(booking.source || 'direct').toLowerCase(),
                checkIn: booking.checkIn || '',
                checkOut: booking.checkOut || '',
                nights,
                gross,
                fees,
                net,
                cash,
                bank,
                card,
                otaPayouts,
                pending,
                future,
                unpaid,
                overpaid,
                uncollectible,
                unknown,
                unknownKeys: Array.from(new Set(unknownKeys)),
                badCC: !!booking.badCC
            };
        }

        // ------------------------------------------------------------------
        // 4. DATE PRESETS & VIEW SWITCHERS
        // ------------------------------------------------------------------

        window.applyPeriodPreset = (preset) => {
            const startEl = document.getElementById('acc-date-start');
            const endEl = document.getElementById('acc-date-end');
            if (!startEl || !endEl) return;

            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();

            if (preset === 'this_month') {
                startEl.value = getLocalYMD(new Date(y, m, 1));
                endEl.value = getLocalYMD(new Date(y, m + 1, 0));
            } else if (preset === 'last_month') {
                startEl.value = getLocalYMD(new Date(y, m - 1, 1));
                endEl.value = getLocalYMD(new Date(y, m, 0));
            } else if (preset === 'next_month') {
                startEl.value = getLocalYMD(new Date(y, m + 1, 1));
                endEl.value = getLocalYMD(new Date(y, m + 2, 0));
            } else if (preset === 'this_week') {
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                startEl.value = getLocalYMD(new Date(y, m, diff));
                endEl.value = getLocalYMD(new Date(y, m, diff + 6));
            } else if (preset === 'last_week') {
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6 : 1) - 7;
                startEl.value = getLocalYMD(new Date(y, m, diff));
                endEl.value = getLocalYMD(new Date(y, m, diff + 6));
            } else if (preset === 'this_year') {
                startEl.value = `${y}-01-01`;
                endEl.value = `${y}-12-31`;
            } else if (preset === 'last_year') {
                startEl.value = `${y - 1}-01-01`;
                endEl.value = `${y - 1}-12-31`;
            } else if (preset === 'all') {
                startEl.value = '';
                endEl.value = '';
            }

            window.renderAccounting();
        };

        window.onCustomDateChange = () => {
            const presetEl = document.getElementById('acc-period-preset');
            if (presetEl) presetEl.value = 'custom';
            window.renderAccounting();
        };

            const rollupEl = document.getElementById('view-rollup');
            const btnLedger = document.getElementById('btn-view-ledger');
            const btnRollup = document.getElementById('btn-view-rollup');

            if (view === 'rollup') {
                ledgerEl?.classList.add('hidden');
                rollupEl?.classList.remove('hidden');
                rollupEl?.classList.add('flex');
                if (btnLedger) btnLedger.className = 'px-2 py-0.5 rounded text-slate-600 hover:bg-white cursor-pointer';

                rollupEl?.classList.add('hidden');
                rollupEl?.classList.remove('flex');
                ledgerEl?.classList.remove('hidden');

            }
        };

        window.setRollupGranularity = (gran) => {
            rollupGranularity = gran;

            const btnY = document.getElementById('btn-rollup-yearly');

            if (btnM) btnM.className = gran === 'monthly' ? 'px-2 py-0.5 rounded bg-indigo-600 text-white cursor-pointer' : 'px-2 py-0.5 rounded text-slate-600 hover:bg-slate-100 cursor-pointer';

        window.sortAccounting = (key) => {
            if (sortKey === key) sortAsc = !sortAsc;

                sortKey = key;

        // ------------------------------------------------------------------
        // 5. DETAILED LEDGER RENDERER & STICKY TOTALS

        function renderCellHtml(colKey, r) {

            }

                return `<td class="py-1.5 px-2 border-r border-slate-200 text-right font-black ${r.unpaid > 0 ? 'text-orange-600 bg-orange-50/70' : 'text-slate-300'} ${r.badCC ? 'underline decoration-dashed decoration-red-500' : ''}">${fmtMoney(r.unpaid)}</td>`;

                return `<td class="py-1.5 px-2 border-r border-slate-200 text-right ${r.uncollectible > 0 ? 'text-slate-500 bg-slate-100' : 'text-slate-300'}">${fmtMoney(r.uncollectible)}</td>`;

                return `<td class="py-1.5 px-2 border-r border-slate-200 text-right font-black ${r.unknown > 0 ? 'text-fuchsia-700 bg-fuchsia-50' : 'text-slate-300'}" title="${unkTitle}">${fmtMoney(r.unknown)}</td>`;

            return '';
        }

        window.renderAccounting = () => {
            const curProp = getActivePropertyId();
            const todayStr = getLocalYMD(new Date());
            const dateBasis = document.getElementById('acc-date-basis')?.value || 'checkIn';
            const startStr = document.getElementById('acc-date-start')?.value || '';
            const endStr = document.getElementById('acc-date-end')?.value || '';
            const includePending = !!document.getElementById('acc-include-pending')?.checked;
            const otaLagDays = Math.max(0, parseInt(document.getElementById('acc-ota-lag')?.value, 10) || 0);

            const idFilter = (document.getElementById('acc-filter-id')?.value || '').trim().toUpperCase();
            const nameFilter = (document.getElementById('acc-filter-name')?.value || '').trim().toUpperCase();
            const statusSet = getCheckedSet('acc-status-dropdown');
            const sourceSet = getCheckedSet('acc-source-dropdown');
            const netFilterSet = getCheckedSet('acc-net-dropdown');

            const rows = [];

            allBookings.forEach(b => {
                if (b.isMockTest) return;
                if (toCanonicalPropId(b.property) !== curProp) return;

                if (dateBasis === 'checkIn') {
                    if (startStr && (b.checkIn || '') < startStr) return;
                    if (endStr && (b.checkIn || '') > endStr) return;
                } else if (dateBasis === 'checkOut') {
                    if (startStr && (b.checkOut || '') < startStr) return;
                    if (endStr && (b.checkOut || '') > endStr) return;
                } else if (dateBasis === 'stayover') {
                    if (startStr && (b.checkOut || '') < startStr) return;
                    if (endStr && (b.checkIn || '') > endStr) return;
                }

                const fin = classifyBookingFinancials(b, todayStr, otaLagDays, includePending, dateBasis, startStr, endStr);
                if (!fin) return;

                if (statusSet.size > 0 && !statusSet.has(fin.status)) return;
                if (sourceSet.size > 0 && !sourceSet.has(fin.source)) return;
                if (idFilter && !String(fin.bookId).toUpperCase().includes(idFilter)) return;
                if (nameFilter && !`${fin.name} ${fin.unknownKeys.join(' ')}`.toUpperCase().includes(nameFilter)) return;

                if (netFilterSet.size > 0) {
                    const matchesAnyBucket = Array.from(netFilterSet).some(k => (Number(fin[k]) || 0) > 0);
                    if (!matchesAnyBucket) return;
                }

                rows.push(fin);
            });

            rows.sort((a, b) => {
                const vA = a[sortKey] ?? '';
                const vB = b[sortKey] ?? '';
                if (typeof vA === 'number' && typeof vB === 'number') {
                    return sortAsc ? vA - vB : vB - vA;
                }
                const cmp = String(vA).localeCompare(String(vB));
                return sortAsc ? cmp : -cmp;
            });

            lastComputedRows = rows;

            const totals = {
                nights: 0, gross: 0, fees: 0, net: 0, cash: 0, bank: 0, card: 0,
                otaPayouts: 0, pending: 0, future: 0, unpaid: 0, overpaid: 0, uncollectible: 0, unknown: 0
            };

            const visibleCols = COLUMNS.filter(c => c.visible);
            const tbody = document.getElementById('acc-ledger-body');
            const tfoot = document.getElementById('acc-ledger-foot');
            if (!tbody || !tfoot) return;

            if (visibleCols.length === 0) {
                tbody.innerHTML = `<tr><td class="text-center py-12 text-slate-400 font-black uppercase tracking-widest">No columns selected &mdash; choose columns from Columns &blacktriangledown;</td></tr>`;
                tfoot.innerHTML = '';
                return;
            }

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${visibleCols.length}" class="text-center py-12 text-slate-400 font-black uppercase tracking-widest">No reservations match the current filters.</td></tr>`;
            } else {
                tbody.innerHTML = rows.map(r => {
                    totals.nights += r.nights;
                    totals.gross = roundCurrency(totals.gross + r.gross);
                    totals.fees = roundCurrency(totals.fees + r.fees);
                    totals.net = roundCurrency(totals.net + r.net);
                    totals.cash = roundCurrency(totals.cash + r.cash);
                    totals.bank = roundCurrency(totals.bank + r.bank);
                    totals.card = roundCurrency(totals.card + r.card);
                    totals.otaPayouts = roundCurrency(totals.otaPayouts + r.otaPayouts);
                    totals.pending = roundCurrency(totals.pending + r.pending);
                    totals.future = roundCurrency(totals.future + r.future);
                    totals.unpaid = roundCurrency(totals.unpaid + r.unpaid);
                    totals.overpaid = roundCurrency(totals.overpaid + r.overpaid);
                    totals.uncollectible = roundCurrency(totals.uncollectible + r.uncollectible);
                    totals.unknown = roundCurrency(totals.unknown + r.unknown);

                    const isDead = NON_COLLECTIBLE_STATUSES.has(r.status);
                    const cells = visibleCols.map(c => renderCellHtml(c.key, r)).join('');

                    return `<tr onclick="window.editStaff('${r.id}')" class="hover:bg-indigo-50/60 cursor-pointer transition-colors ${isDead ? 'bg-slate-50/80 text-slate-500' : 'text-slate-800'}">${cells}</tr>`;
                }).join('');
            }

            tfoot.innerHTML = `<tr>${visibleCols.map((c, idx) => {
                if (idx === 0) return `<td class="py-2 px-2 border-r border-slate-700 uppercase tracking-wider text-[11px]">Totals (${rows.length})</td>`;
                if (c.key === 'nights') return `<td class="py-2 px-1.5 border-r border-slate-700 text-center">${totals.nights}</td>`;
                if (c.key === 'overpaid') return `<td class="py-2 px-2 border-r border-slate-700 text-right ${c.hdrCls || ''}">${totals.overpaid > 0 ? '-฿' + fmtMoney(totals.overpaid) : '฿0.00'}</td>`;
                if (c.isMoney) return `<td class="py-2 px-2 border-r border-slate-700 text-right ${c.hdrCls || ''}">฿${fmtMoney(totals[c.key])}</td>`;
                return `<td class="py-2 px-2 border-r border-slate-700"></td>`;
            }).join('')}</tr>`;

            const pill = document.getElementById('acc-audit-pill');
            if (pill) {
                const overPart = totals.overpaid > 0 ? ` | Overpaid: -฿${fmtMoney(totals.overpaid)}` : '';
                const unkPart = totals.unknown > 0 ? ` | Unknown: ฿${fmtMoney(totals.unknown)}` : '';
                pill.innerText = `${rows.length} Rows | Net: ฿${fmtMoney(totals.net)} | Unpaid: ฿${fmtMoney(totals.unpaid)}${overPart}${unkPart}`;
            }

            if (activeView === 'rollup') {
                renderRollupView();
            }
        };

        // ------------------------------------------------------------------
        // 6. WEEKLY / MONTHLY / YEARLY SUMMARIES + BAR CHART
        // ------------------------------------------------------------------

        function getWeekStartMonday(ymd) {
            const ms = parseYMD(ymd);
            if (!ms) return '0000-00-00';
            const d = new Date(ms);
            const day = d.getUTCDay();
            const diff = d.getUTCDate() - day + (day === 0 ? -6 : 1);
            d.setUTCDate(diff);
            return d.toISOString().split('T')[0];
        }

        function renderRollupView() {
            const buckets = new Map();

            lastComputedRows.forEach(r => {
                const rawDate = r.checkIn || r.checkOut || '0000-00-00';
                let key = rawDate.slice(0, 7);
                if (rollupGranularity === 'yearly') key = rawDate.slice(0, 4);
                else if (rollupGranularity === 'weekly') key = getWeekStartMonday(rawDate);

                if (!buckets.has(key)) {
                    buckets.set(key, {
                        period: key, count: 0, nights: 0, gross: 0, fees: 0, net: 0,
                        cash: 0, bank: 0, card: 0, otaPayouts: 0, pending: 0,
                        future: 0, unpaid: 0, overpaid: 0, uncollectible: 0, unknown: 0
                    });
                }
                const b = buckets.get(key);
                b.count += 1;
                b.nights += r.nights;
                b.gross = roundCurrency(b.gross + r.gross);
                b.fees = roundCurrency(b.fees + r.fees);
                b.net = roundCurrency(b.net + r.net);
                b.cash = roundCurrency(b.cash + r.cash);
                b.bank = roundCurrency(b.bank + r.bank);
                b.card = roundCurrency(b.card + r.card);
                b.otaPayouts = roundCurrency(b.otaPayouts + r.otaPayouts);
                b.pending = roundCurrency(b.pending + r.pending);
                b.future = roundCurrency(b.future + r.future);
                b.unpaid = roundCurrency(b.unpaid + r.unpaid);
                b.overpaid = roundCurrency(b.overpaid + r.overpaid);
                b.uncollectible = roundCurrency(b.uncollectible + r.uncollectible);
                b.unknown = roundCurrency(b.unknown + r.unknown);
            });

            const sorted = Array.from(buckets.values()).sort((a, b) => a.period.localeCompare(b.period));
            lastRollupRows = sorted;

            const formatPeriodLabel = (p) => {
                if (rollupGranularity === 'yearly') return p;
                if (rollupGranularity === 'weekly') return `Wk ${p.slice(5)}`;
                if (p.length < 7) return p;
                const [y, m] = p.split('-');
                const mIdx = parseInt(m, 10) - 1;
                return `${mNames[mIdx] || m} ${y}`;
            };

            const chartEl = document.getElementById('rollup-chart-container');
            if (chartEl) {
                if (sorted.length === 0) {
                    chartEl.innerHTML = `<div class="text-center py-6 text-xs font-bold text-slate-400 uppercase">No data in range to chart.</div>`;
                } else {
                    const maxVal = Math.max(1, ...sorted.map(x => x.cash + x.bank + x.card + x.otaPayouts + x.pending + x.future + x.fees));
                    chartEl.innerHTML = `
                        <div class="flex items-end gap-3 h-40 pt-5 pb-1 min-w-max px-2">
                            ${sorted.map(item => {
                                const totalBar = item.cash + item.bank + item.card + item.otaPayouts + item.pending + item.future + item.fees;
                                const hPct = Math.max(4, Math.round((totalBar / maxVal) * 100));
                                const seg = (val) => totalBar > 0 ? ((val / totalBar) * 100).toFixed(2) : 0;
                                return `
                                    <div class="flex flex-col items-center w-16 shrink-0">
                                        <span class="text-[9px] font-black text-slate-700 mb-1">฿${Math.round(item.net).toLocaleString()}</span>
                                        <div class="w-9 rounded-t overflow-hidden flex flex-col-reverse border border-slate-300 shadow-2xs" style="height: ${hPct}%;">
                                            <div style="height:${seg(item.cash)}%" class="bg-emerald-500" title="Cash: ฿${fmtMoney(item.cash)}"></div>
                                            <div style="height:${seg(item.bank)}%" class="bg-sky-500" title="Bank: ฿${fmtMoney(item.bank)}"></div>
                                            <div style="height:${seg(item.card)}%" class="bg-blue-500" title="Card: ฿${fmtMoney(item.card)}"></div>
                                            <div style="height:${seg(item.otaPayouts)}%" class="bg-teal-500" title="OTA Payouts: ฿${fmtMoney(item.otaPayouts)}"></div>
                                            <div style="height:${seg(item.pending)}%" class="bg-amber-400" title="Pending: ฿${fmtMoney(item.pending)}"></div>
                                            <div style="height:${seg(item.future)}%" class="bg-indigo-400" title="Future: ฿${fmtMoney(item.future)}"></div>
                                            <div style="height:${seg(item.fees)}%" class="bg-rose-400" title="Fees/Comm: ฿${fmtMoney(item.fees)}"></div>
                                        </div>
                                        <span class="text-[10px] font-black text-slate-600 uppercase mt-1.5">${formatPeriodLabel(item.period)}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }
            }

            const moneyCols = COLUMNS.filter(c => c.isMoney && c.visible);
            const rHead = document.getElementById('rollup-table-head');
            const rBody = document.getElementById('rollup-table-body');
            const rFoot = document.getElementById('rollup-table-foot');
            if (!rHead || !rBody || !rFoot) return;

            rHead.innerHTML = `<tr>
                <th class="py-2 px-2.5 border-r border-slate-700">Period</th>
                <th class="py-2 px-2 border-r border-slate-700 text-center">Bookings</th>
                <th class="py-2 px-2 border-r border-slate-700 text-center">Nts</th>
                ${moneyCols.map(c => `<th class="py-2 px-2 border-r border-slate-700 text-right ${c.hdrCls || ''}">${c.label}</th>`).join('')}
            </tr>`;

            const grand = { count: 0, nights: 0, gross: 0, fees: 0, net: 0, cash: 0, bank: 0, card: 0, otaPayouts: 0, pending: 0, future: 0, unpaid: 0, overpaid: 0, uncollectible: 0, unknown: 0 };

            rBody.innerHTML = sorted.map(b => {
                grand.count += b.count;
                grand.nights += b.nights;
                moneyCols.forEach(c => { grand[c.key] = roundCurrency(grand[c.key] + b[c.key]); });

                return `<tr class="hover:bg-slate-50">
                    <td class="py-1.5 px-2.5 border-r border-slate-200 font-black uppercase text-slate-800">${formatPeriodLabel(b.period)}</td>
                    <td class="py-1.5 px-2 border-r border-slate-200 text-center">${b.count}</td>
                    <td class="py-1.5 px-2 border-r border-slate-200 text-center">${b.nights}</td>
                    ${moneyCols.map(c => {
                        if (c.key === 'overpaid') return `<td class="py-1.5 px-2 border-r border-slate-200 text-right ${b.overpaid > 0 ? 'font-black text-purple-700 bg-purple-50' : 'text-slate-300'}">${b.overpaid > 0 ? '-' + fmtMoney(b.overpaid) : '0.00'}</td>`;
                        return `<td class="py-1.5 px-2 border-r border-slate-200 text-right ${c.key === 'net' ? 'font-black text-emerald-700 bg-emerald-50/60' : ''}">${fmtMoney(b[c.key])}</td>`;
                    }).join('')}
                </tr>`;
            }).join('');

            rFoot.innerHTML = `<tr>
                <td class="py-2 px-2.5 border-r border-slate-700 uppercase">Total</td>
                <td class="py-2 px-2 border-r border-slate-700 text-center">${grand.count}</td>
                <td class="py-2 px-2 border-r border-slate-700 text-center">${grand.nights}</td>
                ${moneyCols.map(c => {
                    if (c.key === 'overpaid') return `<td class="py-2 px-2 border-r border-slate-700 text-right ${c.hdrCls || ''}">${grand.overpaid > 0 ? '-฿' + fmtMoney(grand.overpaid) : '฿0.00'}</td>`;
                    return `<td class="py-2 px-2 border-r border-slate-700 text-right ${c.hdrCls || ''}">฿${fmtMoney(grand[c.key])}</td>`;
                }).join('')}
            </tr>`;
        }

        // ------------------------------------------------------------------
        // 7. MULTI-SHEET XLSX SPREADSHEET EXPORTER
        // ------------------------------------------------------------------

        window.exportAccountingXlsx = () => {
            if (lastComputedRows.length === 0) return;

            const wb = XLSX.utils.book_new();
            const visibleCols = COLUMNS.filter(c => c.visible);
            const ledgerHeader = visibleCols.map(c => c.label);

            const ledgerData = lastComputedRows.map(r => visibleCols.map(c => {
                if (c.key === 'status' || c.key === 'source') return String(r[c.key] || '').toUpperCase();
                return r[c.key];
            }));

            const ledgerTotalRow = visibleCols.map((c, idx) => {
                if (idx === 0) return 'TOTAL';
                if (idx === 1) return `${ledgerData.length} Rows`;
                if (c.key === 'nights' || c.isMoney) {
                    return roundCurrency(ledgerData.reduce((acc, row) => acc + (Number(row[idx]) || 0), 0));
                }
                return '';
            });

            const wsLedger = XLSX.utils.aoa_to_sheet([ledgerHeader, ...ledgerData, ledgerTotalRow]);
            XLSX.utils.book_append_sheet(wb, wsLedger, 'Detailed');

            if (lastRollupRows.length === 0) renderRollupView();
            const moneyCols = COLUMNS.filter(c => c.isMoney && c.visible);
            const rollupHeader = ['Period', 'Bookings', 'Nights', ...moneyCols.map(c => c.label)];
            const rollupData = lastRollupRows.map(b => [b.period, b.count, b.nights, ...moneyCols.map(c => b[c.key])]);
            const wsRollup = XLSX.utils.aoa_to_sheet([rollupHeader, ...rollupData]);
            XLSX.utils.book_append_sheet(wb, wsRollup, 'Summaries');

            const propTag = (toDisplayPropKey(getActivePropertyId()) || getActivePropertyId()).toUpperCase();
            const todayTag = getLocalYMD(new Date());
            XLSX.writeFile(wb, `${propTag}_Accounting_${todayTag}.xlsx`);
        };

        // ------------------------------------------------------------------
        // 8. BOOTLOADER & REALTIME SNAPSHOT SUBSCRIPTION
        // ------------------------------------------------------------------

        async function initAccounting() {
            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }

                const catalog = await loadPropertiesCatalog();
                const curProp = getActivePropertyId();
                const activeCfg = catalog.find(p => p.id === curProp) || catalog[0] || {};
                const shortTitle = toDisplayPropKey(activeCfg.id || curProp) || activeCfg.short || '';
                document.title = shortTitle ? `${shortTitle} | Accounting` : 'Wild & Wandering | Accounting';

                paymentSchemaMap = buildExactPaymentMap(activeCfg);

                window.currentPropertyConfig = activeCfg;
                window.paymentMethods = normalizePaymentMethods(activeCfg.payments || []);
                window.hotelRooms = activeCfg.rooms || [];
                window.roomTypes = [...new Set((activeCfg.rooms || []).filter(r => r.type).map(r => r.type))];
                window.currentUserRole = 'admin';
                window.currentUserEmail = 'admin';

                initColumnPicker();
                renderTableHeaders();
                window.applyPeriodPreset('this_month');

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'staff'), (snap) => {
                    allBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    window.staff = allBookings;
                    const loader = document.getElementById('boot-loader');
                    if (loader) loader.style.display = 'none';
                    window.renderAccounting();
                }, (err) => {
                    console.error('[Accounting Snapshot Error]:', err);
                    const statusEl = document.getElementById('sync-status');
                    if (statusEl) statusEl.innerText = 'Database Connection Error';
                });

                mountNav();
                if (window.lucide) window.lucide.createIcons();
            } catch (err) {
                console.error('[Accounting Init Error]:', err);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAccounting);
        } else {
            initAccounting();
        }
    </script>
</body>
</html>
